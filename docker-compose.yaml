services:
  expense-tracker:
    build:
      context: .
      dockerfile: ./cmd/expense-tracker/Dockerfile
    container_name: expense-tracker
    environment:
      - HTTP_ADDR=:8787
      # - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      # - HTTP_ALLOWED_ORIGINS=${HTTP_ALLOWED_ORIGINS}
      - POSTGRES_HOST=expense-tracker-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - REDIS_HOST=expense-tracker-cache-redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # - LOGGER_LEVEL=${LOGGER_LEVEL}
      # - LOGGER_FOLDER=/app/out/logs
      # - TIME_ZONE=${TIME_ZONE}
      # volumes:
      #   - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "${SERVER_PORT}:8787"
    restart: always
    depends_on:
      expense-tracker-postgres:
        condition: service_healthy
      expense-tracker-cache:
        condition: service_healthy
  expense-tracker-postgres:
    image: postgres:18.6-bookworm
    container_name: expense-tracker-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  expense-tracker-cache:
    image: redis:8
    container_name: expense-tracker-cache-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
